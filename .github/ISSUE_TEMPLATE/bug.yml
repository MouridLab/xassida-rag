name: Bug
description: Report a reproducible microservice failure
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps without credentials, corpus data or personal information.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0 or commit SHA
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: This report contains no secret, private corpus content or personal data.
          required: true
